steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - europe-west1-docker.pkg.dev/volmagique-b1e7b/volmagique/core:latest
      - .
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - europe-west1-docker.pkg.dev/volmagique-b1e7b/volmagique/core:latest
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - volmagique-core
      - --image
      - europe-west1-docker.pkg.dev/volmagique-b1e7b/volmagique/core:latest
      - --region
      - europe-west1
      - --platform
      - managed
      - --allow-unauthenticated
      - --min-instances=0
      - --set-secrets=ADMIN_SECRET=ADMIN_SECRET:latest
      - --set-secrets=SENDGRID_API_KEY=SENDGRID_API_KEY:latest
      - --set-secrets=STRIPE_SECRET=STRIPE_SECRET:latest
      - --set-secrets=STRIPE_WEBHOOK_SECRET=STRIPE_WEBHOOK_SECRET:latest
images:
  - europe-west1-docker.pkg.dev/volmagique-b1e7b/volmagique/core:latest
